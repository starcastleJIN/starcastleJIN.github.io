<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기술 블로그 - Tech Notes & Dev Stories</title>
  <meta name="description" content="개발 과정에서의 고민, 트러블슈팅, 새로운 기술 탐구 기록을 공유하는 블로그입니다.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 flex flex-col min-h-screen selection:bg-blue-500 selection:text-white">

  <!-- =========================================================================
       Navigation Header
       ========================================================================= -->
  <header class="sticky top-0 z-50 header-glass">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <!-- Logo / Site Name -->
      <a href="index.html" class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-slate-900 dark:text-white group">
        <span class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-mono font-bold shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
          &lt;/&gt;
        </span>
        <span class="site-author-name">Portfolio</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a href="index.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">홈 (포트폴리오)</a>
        <a href="index.html#projects" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">프로젝트</a>
        <a href="blog.html" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">블로그</a>
      </nav>

      <!-- Right Controls: Theme Toggle & Socials -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Theme Toggle Button -->
        <button type="button" class="theme-toggle-btn p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors" aria-label="테마 변경">
          <!-- Icon injected by main.js -->
        </button>

        <!-- GitHub Icon Link -->
        <a href="#" target="_blank" rel="noopener noreferrer" class="social-github p-2 rounded-xl text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="GitHub 프로필">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>

        <!-- Mobile Menu Toggle Button -->
        <button type="button" id="mobile-menu-toggle" class="md:hidden p-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="모바일 메뉴 열기">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pt-2 pb-4 border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md space-y-2 text-sm font-medium">
      <a href="index.html" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">홈 (포트폴리오)</a>
      <a href="index.html#projects" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">프로젝트</a>
      <a href="blog.html" class="block px-3 py-2 rounded-lg text-blue-600 dark:text-blue-400 font-semibold bg-blue-50 dark:bg-slate-800">블로그</a>
    </div>
  </header>

  <!-- =========================================================================
       Blog Main Content
       ========================================================================= -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 sm:px-6 py-12">
    <!-- Header Section -->
    <div class="mb-10 text-center sm:text-left">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 mb-3">
        <span>Tech Blog & Notes</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        기술 블로그
      </h1>
      <p class="text-slate-600 dark:text-slate-400 mt-2 text-sm sm:text-base">
        개발하며 배우고 느낀 점, 유용한 문제 해결 방법들을 기록합니다.
      </p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="space-y-4 mb-8">
      <!-- Search Input Bar -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <input 
          type="text" 
          id="blog-search-input" 
          placeholder="글 제목, 내용, 태그로 검색..." 
          class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 shadow-sm text-slate-900 dark:text-white placeholder-slate-400"
        />
      </div>

      <!-- Tag Filter Buttons Bar -->
      <div class="flex items-center justify-between flex-wrap gap-3 pt-2">
        <div id="tag-filters" class="flex flex-wrap gap-2 items-center">
          <!-- Injected dynamically by blog.js -->
        </div>
        <span id="post-count-badge" class="text-xs text-slate-500 dark:text-slate-400 font-medium">
          총 0개의 글
        </span>
      </div>
    </div>

    <!-- Blog Posts List Container -->
    <div id="blog-list-container" class="space-y-6">
      <!-- Injected dynamically by blog.js -->
      <div class="animate-pulse space-y-4">
        <div class="h-32 bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
        <div class="h-32 bg-slate-200 dark:bg-slate-800 rounded-2xl"></div>
      </div>
    </div>
  </main>

  <!-- =========================================================================
       Footer
       ========================================================================= -->
  <footer class="border-t border-slate-200 dark:border-slate-800 py-8 text-center text-xs text-slate-500 dark:text-slate-400 mt-16">
    <div class="max-w-6xl mx-auto px-4">
      <p>© <span id="current-year"></span> <span id="footer-author">Developer</span>. All rights reserved.</p>
      <p class="mt-1 text-slate-400 dark:text-slate-500">Hosted on GitHub Pages • Built with HTML, Tailwind CSS & JS</p>
    </div>
  </footer>

  <!-- Core Scripts -->
  <script src="config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blog.js"></script>
</body>
</html>
