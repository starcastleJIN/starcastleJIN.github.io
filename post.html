<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블로그 글 읽기 · starcastleJIN</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- Highlight.js Code Highlighting Style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#090d16] dark:text-slate-100 flex flex-col min-h-screen selection:bg-emerald-500 selection:text-white">

  <!-- =========================================================================
       Navigation Header
       ========================================================================= -->
  <header class="sticky top-0 z-50 header-glass">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <!-- Logo / Site Name -->
      <a href="index.html" class="flex items-center gap-2.5 text-base sm:text-lg font-extrabold tracking-tight text-slate-900 dark:text-white group">
        <span class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-mono font-bold shadow-md shadow-emerald-500/20 group-hover:scale-105 transition-transform">
          &lt;/&gt;
        </span>
        <span class="site-author-name">starcastleJIN</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a href="index.html" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">홈 (포트폴리오)</a>
        <a href="index.html#projects" class="hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">프로젝트</a>
        <a href="blog.html" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline">블로그 목록</a>
      </nav>

      <!-- Right Controls: Theme Toggle & Socials -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Theme Toggle Button -->
        <button type="button" class="theme-toggle-btn p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors" aria-label="테마 변경">
          <!-- Icon injected by main.js -->
        </button>

        <!-- GitHub Icon Link -->
        <a href="https://github.com/starcastleJIN" target="_blank" rel="noopener noreferrer" class="social-github p-2 rounded-xl text-slate-700 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="GitHub 프로필">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>

        <!-- Mobile Menu Toggle Button -->
        <button type="button" id="mobile-menu-toggle" class="md:hidden p-2 rounded-xl text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="모바일 메뉴 열기" aria-expanded="false">
          <svg class="icon-menu-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          <svg class="icon-menu-close hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden px-4 pt-2 pb-4 border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md space-y-2 text-sm font-medium">
      <a href="index.html" class="block px-3 py-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">홈 (포트폴리오)</a>
      <a href="blog.html" class="block px-3 py-2 rounded-lg text-emerald-600 dark:text-emerald-400 font-semibold bg-emerald-50 dark:bg-slate-800">블로그 목록</a>
    </div>
  </header>

  <!-- =========================================================================
       Article Reader Section
       ========================================================================= -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-10">
    <!-- Back to Blog Button -->
    <div class="mb-8">
      <a href="blog.html" class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-400 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        블로그 목록으로 돌아가기
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10">
      
      <!-- Article Main Column -->
      <article id="post-article-container" class="lg:col-span-8 bento-card p-6 sm:p-10">
        
        <!-- Article Header Metadata -->
        <header class="pb-8 mb-8 border-b border-slate-200 dark:border-slate-800">
          <div class="flex items-center gap-2.5 text-xs text-slate-500 dark:text-slate-400 mb-4">
            <span id="post-category" class="px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 font-bold border border-emerald-500/20">
              Tech
            </span>
            <span>•</span>
            <time id="post-date">2025-01-01</time>
            <span>•</span>
            <span id="post-read-time">3 min read</span>
          </div>

          <h1 id="post-title" class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-900 dark:text-white leading-tight mb-6">
            포스트 제목 로딩 중...
          </h1>

          <div id="post-tags" class="flex flex-wrap gap-2">
            <!-- Tags injected by blog.js -->
          </div>
        </header>

        <!-- Markdown Rendered HTML Content -->
        <div id="post-content" class="prose dark:prose-invert">
          <div class="animate-pulse space-y-4 py-8">
            <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-3/4"></div>
            <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-full"></div>
            <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-5/6"></div>
          </div>
        </div>

        <!-- Post Next/Previous Navigation -->
        <div id="post-pagination">
          <!-- Injected dynamically by blog.js -->
        </div>

      </article>

      <!-- Desktop Sidebar: Table of Contents -->
      <aside class="hidden lg:block lg:col-span-4">
        <div id="post-toc-wrapper" class="sticky top-24 p-6 bento-card">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-3 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
            목차 (Table of Contents)
          </h3>
          <ul id="post-toc-list" class="space-y-1.5 border-l-2 border-slate-100 dark:border-slate-800 pl-3">
            <!-- TOC items injected by blog.js -->
          </ul>
        </div>
      </aside>

    </div>
  </main>

  <!-- =========================================================================
       Footer
       ========================================================================= -->
  <footer class="border-t border-slate-200 dark:border-slate-800 py-8 text-center text-xs text-slate-500 dark:text-slate-400 mt-16">
    <div class="max-w-6xl mx-auto px-4">
      <p>© <span id="current-year"></span> <span id="footer-author">starcastleJIN</span>. All rights reserved.</p>
      <p class="mt-1 text-slate-400 dark:text-slate-500 font-mono text-[11px]">Hosted on GitHub Pages • Built with HTML, Tailwind CSS &amp; JS</p>
    </div>
  </footer>

  <!-- Markdown Parser (Marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Syntax Highlighter (Highlight.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Core Scripts -->
  <script src="config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blog.js"></script>
</body>
</html>
